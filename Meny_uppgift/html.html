<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exempel: javascript</title>
  </head>
  <body>
    <h1 id="titel">Välkommen</h1>

    <p><button onclick="byt1()">Byt titel</button></p>

    <p id="green" style="background-color: green">Här är det grönt</p>

    <p><button onclick="bytGron()">Byt grön</button></p>

    <p><button id="knappen" onclick="knappText()">Hej</button></p>

    <p id="texten" onclick="pText()">Hej</p>

    <script>
      function byt1() {
        document.getElementById("titel").innerHTML =
          "Välkommen till elev för en dag!";
      }

      function bytGron() {
        var p = document.getElementById("green");
        p.style.backgroundColor = "HotPink";
        p.innerHTML = "Här var det grönt";
      }

      function knappText() {
        var knappen = document.getElementById("knappen");
        if (knappen.innerHTML == "Hej") {
          knappen.innerHTML = "Hå";
        } else if (knappen.innerHTML == "Hå") {
          knappen.innerHTML = "Hej";
        }
      }

      function pText() {
        var texten = document.getElementById("texten");
        if (texten.innerHTML == "Hej") {
          texten.innerHTML = "Hå";
        } else if (texten.innerHTML == "Hå") {
          texten.innerHTML = "Hej";
        }
      }
    </script>
  </body>
</html>
