<!doctype html>
<html lang="sv">
  <head>
    <style>
      body {
        padding: 25px;
        font-family:
        sans-serif;
        transition: 0.4s;
        text-align: center;
      }
      .morkt-lage {
        background: black;
        color: white;
      }
      #nedrakning {
        font-size: 150px;
      }
    </style>
  </head>
  <body id="b">
    <button onclick="document.body.classList.toggle('morkt-lage')">Mörkt/Ljust</button>
    <div id="nedrakning">0</div>
    <input id="input" type="number" placeholder="Sekunder" />
    <button onclick="start()">Start/Paus</button>
    <button onclick="stopp()">Stopp</button>

    <script>
      let klocka, sek = 0;

      function start() {
        if (sek > 0) klocka = setInterval(raknaNed, 1000);
        if (sek <= 0) sek = parseInt(document.getElementById('input').value);
        if (klocka) return clearInterval(klocka), klocka = null;
      }

      function raknaNed() {
        let d = document.getElementById('nedrakning');
        if (sek <= 0) {
          d.innerHTML = "KLAR!";
          document.body.classList.add('morkt-lage');
          stopp();
        } else {
          d.innerHTML = sek-- + " s";
        }
      }

      function stopp() {
        clearInterval(klocka);
        klocka = null; sek = 0;
        if(document.getElementById('nedräkning').innerHTML !== "KLAR!"){
        document.getElementById('nedräkning').innerHTML = "0s";
        }
      }
    </script>
  </body>
</html>
